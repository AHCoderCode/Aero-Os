name: Build AeroOS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: aeroos-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish_recovery:
    name: Republish the already verified ISO for direct download
    if: github.run_number == 19
    runs-on: ubuntu-24.04
    steps:
      - name: Download the successful Build 17 ISO artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 43205000199 \
            --repo "$GITHUB_REPOSITORY" \
            --name AeroOS-ISO \
            --dir recovered

      - name: Verify the recovered ISO before publishing
        shell: bash
        run: |
          set -euo pipefail
          test -s recovered/live-image-amd64.hybrid.iso
          test -s recovered/live-image-amd64.hybrid.iso.sha256
          test -s recovered/iso-boot-report.txt
          cd recovered
          sha256sum --check live-image-amd64.hybrid.iso.sha256
          grep -qi "BIOS" iso-boot-report.txt

      - name: Publish the verified ISO as a direct release download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="aeroos-recovery-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            recovered/live-image-amd64.hybrid.iso \
            recovered/live-image-amd64.hybrid.iso.sha256 \
            recovered/iso-boot-report.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "AeroOS USB Live — direct download" \
            --notes "This is the already verified AeroOS image from successful Build 17. The operating-system source is unchanged; this release republishes the ISO as a direct file download instead of an Actions ZIP. Verify the SHA-256 file before writing the ISO to USB." \
            --prerelease

  build:
    name: Build Debian Live hybrid ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build inside Debian Trixie
        shell: bash
        run: |
          set -euo pipefail
          docker run --privileged --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            debian:trixie bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap xorriso isolinux syslinux-common \
                squashfs-tools dosfstools mtools ca-certificates gpgv libxml2-utils python3
              chmod +x auto/config
              sh -n auto/config
              sh -n config/includes.chroot/usr/local/bin/aeroos-welcome
              sh -n config/includes.chroot/usr/local/bin/aeroos-control-center
              bash -n config/includes.chroot/usr/local/bin/aeroos-theme-picker
              sh -n config/includes.chroot/usr/local/bin/aeroos-performance
              bash -n config/includes.chroot/usr/local/sbin/aeroos-setup-persistence
              sh -n config/hooks/normal/9990-aeroos-finish.hook.chroot
              python3 scripts/validate-config.py
              ./scripts/validate-config.sh
              ./scripts/test-persistence-parser.sh
              ./auto/config
              lb config --dump
              lb build 2>&1 | tee build.log
              test -s live-image-amd64.hybrid.iso
              xorriso -indev live-image-amd64.hybrid.iso -report_el_torito plain 2>&1 | tee iso-boot-report.txt
              grep -qi "BIOS" iso-boot-report.txt
              sha256sum live-image-amd64.hybrid.iso > live-image-amd64.hybrid.iso.sha256
              ls -lh live-image-amd64.hybrid.iso live-image-amd64.hybrid.iso.sha256 iso-boot-report.txt
            '

      - name: Upload ISO and verification logs
        uses: actions/upload-artifact@v7
        with:
          name: AeroOS-ISO
          path: |
            live-image-amd64.hybrid.iso
            live-image-amd64.hybrid.iso.sha256
            iso-boot-report.txt
            build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish ISO as a direct release download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="aeroos-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            live-image-amd64.hybrid.iso \
            live-image-amd64.hybrid.iso.sha256 \
            iso-boot-report.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "AeroOS USB Live Build ${GITHUB_RUN_NUMBER}" \
            --notes "Debian Trixie-based AeroOS USB Live image. Download the .iso asset directly; do not download the Actions artifact ZIP. Verify it with the accompanying SHA-256 file before writing it to USB." \
            --prerelease
